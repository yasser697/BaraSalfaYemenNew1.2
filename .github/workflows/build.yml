name: Build Android APK v1.2

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK v1.2
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle" | head -n 1))
          echo "Found Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK v1.2
        uses: actions/upload-artifact@v4
        with:
          name: BaraAlSalfa-v1.2-APK
          path: "**/app/build/outputs/apk/**/*.apk"
